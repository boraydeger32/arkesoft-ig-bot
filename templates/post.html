<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; src: url('{{FONT_URL}}') format('truetype'); font-weight: 100 900; font-display: block; }
  :root {
    --bg: #f7f8fa;
    --ink: #0f1115;
    --muted: #5b6270;
    --accent: #1d4ed8;
    --line: #d9dde4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); }
  body {
    font-family: "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif;
    color: var(--ink);
    position: relative;
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 90px 90px;
    opacity: .35;
    mask-image: radial-gradient(ellipse at 30% 20%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 30% 20%, #000 20%, transparent 75%);
  }
  .frame { position: absolute; inset: 72px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center;
         font-size: 26px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .top b { color: var(--ink); font-weight: 700; letter-spacing: .22em; }
  .tag { display: inline-block; align-self: flex-start; margin-top: 110px; padding: 12px 22px; border: 2px solid var(--ink);
         border-radius: 999px; font-size: 26px; font-weight: 600; letter-spacing: .06em; }
  h1 { margin-top: 48px; font-size: 92px; line-height: 1.04; font-weight: 800; letter-spacing: -.025em;
       max-width: 900px; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 40px; font-size: 40px; line-height: 1.35; color: var(--muted); max-width: 860px; }
  .body { margin-top: 40px; font-size: 38px; line-height: 1.45; max-width: 880px; }
  .bar { width: 160px; height: 10px; background: var(--accent); border-radius: 6px; margin-top: 56px; }
  .bottom { margin-top: auto; display: flex; align-items: flex-end; gap: 36px; }
  .source { font-size: 26px; color: var(--muted); flex: 1; }
  .counter { font-size: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .swipe { font-size: 24px; color: var(--ink); font-weight: 700; letter-spacing: .3em; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <div class="top"><b>ARKESOFT</b><span>{{DATE_LABEL}}</span></div>
    <div class="tag">{{TAG}}</div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUBLINE}}</div>
    <div class="body">{{BODY}}</div>
    <div class="bar"></div>
    <div class="bottom">
      <div class="source">{{SOURCE}}</div>
      <div class="counter">{{COUNTER}}</div>
      <div class="swipe">{{SWIPE}}</div>
    </div>
  </div>
</body>
</html>

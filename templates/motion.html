<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Inter'; src: url('{{FONT_URL}}') format('truetype'); font-weight: 100 900; font-display: block; }
  /* ===== ARKESOFT motion şablonu — koyu tema =====
     Python tarafı window.__SPEC verir, her kare için window.seek(t) çağırır.
     Tüm hareket CSS animasyonu; seek() animasyonların currentTime'ını ayarlar → kare kare deterministik. */
  :root {
    --bg: #07080c;
    --ink: #f3f4f8;
    --muted: #8b93a7;
    --accent: #6d8cff;      /* mavi-mor: çözüm */
    --accent2: #a78bfa;
    --danger: #ff3d57;      /* kırmızı: kaos */
    --ok: #34d399;
    --panel: #11141c;
    --panel2: #171b26;
    --line: #262b3a;
    --font: "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, "DejaVu Sans", sans-serif;
    --mono: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
  body { font-family: var(--font); color: var(--ink); }
  #stage { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,0,0,.75) 100%); }
  .glow { position: absolute; inset: 0; pointer-events: none; }
  .glow.red { background: radial-gradient(ellipse at 50% 40%, rgba(255,61,87,.26), transparent 62%); }
  .glow.blue { background: radial-gradient(ellipse at 50% 45%, rgba(109,140,255,.28), transparent 60%); }
  .glow.violet { background: radial-gradient(ellipse at 50% 42%, rgba(167,139,250,.30), transparent 58%); }
  .brand { position: absolute; left: 80px; top: 230px; font-size: 26px; letter-spacing: .34em; font-weight: 700; color: var(--muted); opacity: .85; }
  .url { position: absolute; right: 80px; bottom: 420px; font-size: 28px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }

  /* ---- ortak animasyonlar ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(40px); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.86); } 60% { transform: scale(1.03); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes float1 { 0%,100% { transform: var(--tf) translateY(0); } 50% { transform: var(--tf) translateY(-16px); } }
  @keyframes float2 { 0%,100% { transform: var(--tf) translateY(0); } 50% { transform: var(--tf) translateY(14px); } }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: 200% 0; } }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes zoomslow { from { transform: scale(1); } to { transform: scale(1.06); } }

  /* ---- title: kinetik metin ---- */
  .s-title .lines { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-55%); text-align: center; }
  .s-title .line { font-size: 92px; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; opacity: 0;
    animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--d); text-wrap: balance; }
  .s-title .line em { font-style: normal; color: var(--muted); font-weight: 500; }
  .s-title .line strong { font-weight: 800; color: var(--accent); }
  .s-title.danger .line strong { color: var(--danger); }

  /* ---- chaos: dağınık arayüz pencereleri ---- */
  .win { position: absolute; width: 760px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset; overflow: hidden; opacity: 0;
    transform-origin: center; --tf: perspective(1800px) rotateY(var(--ry)) rotateX(var(--rx)) rotate(var(--rz)) scale(var(--sc));
    animation: pop .6s cubic-bezier(.2,.8,.2,1) forwards, float1 6s ease-in-out infinite; animation-delay: var(--d), var(--d); transform: var(--tf); }
  .win.alt { animation-name: pop, float2; }
  .win .bar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--panel2); border-bottom: 1px solid var(--line); font-size: 16px; color: var(--muted); }
  .win .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3a4052; }
  .win .bar i:nth-child(1) { background: #ff5f57; } .win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
  .win .bar span { margin-left: 10px; font-family: var(--mono); }
  .win .body { padding: 18px; font-size: 17px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 15px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .chip.r { background: rgba(255,61,87,.18); color: #ff8595; } .chip.y { background: rgba(254,188,46,.18); color: #ffd37a; }
  .chip.g { background: rgba(52,211,153,.18); color: #7ee8c3; } .chip.b { background: rgba(109,140,255,.18); color: #a9bcff; }
  .sheet td, .sheet th { border-right: 1px solid var(--line); font-size: 14px; }
  .sheet th { background: #1c2130; }
  .sheet td.err { color: #ff8595; font-weight: 700; }
  .chat .msg { max-width: 78%; padding: 12px 16px; border-radius: 16px; margin: 8px 0; background: #1f2433; font-size: 17px; line-height: 1.35; }
  .chat .msg.me { margin-left: auto; background: #1f5b4a; }
  .chat .msg small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .map { height: 300px; position: relative; background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/60px 60px, linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/60px 60px; border-radius: 10px; }
  .map .pin { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 8px rgba(255,61,87,.2); }
  .map .route { position: absolute; inset: 0; }
  .mail .row { display: flex; gap: 14px; padding: 12px 6px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .mail .row b { width: 170px; } .mail .row span { flex: 1; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail .row.unread b, .mail .row.unread span { color: var(--ink); font-weight: 700; }
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kanban .col { background: #0d1017; border-radius: 10px; padding: 10px; min-height: 240px; }
  .kanban .col h5 { font-size: 13px; color: var(--muted); margin-bottom: 8px; letter-spacing: .08em; }
  .kanban .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 8px; }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 1000px; background: linear-gradient(to bottom, transparent, rgba(7,8,12,.92) 48%); }
  .labels { position: absolute; left: 80px; right: 80px; bottom: 450px; }
  .label { display: flex; align-items: center; gap: 16px; font-size: 34px; margin: 16px 0; text-shadow: 0 2px 12px #000; opacity: 0; animation: rise .5s ease forwards; animation-delay: var(--d); }
  .label .n { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,61,87,.22); color: var(--danger); display: grid; place-items: center; font-size: 18px; font-weight: 800; }
  .label b { font-weight: 700; } .label span { color: var(--muted); } .label .arr { color: var(--danger); }
  .s-chaos .lines { position: absolute; left: 80px; right: 80px; top: 300px; font-size: 54px; line-height: 1.2; font-weight: 700; text-wrap: balance; opacity: 0; animation: rise .6s ease forwards; }

  /* ---- counter: boşa giden zaman ---- */
  .s-counter .wins { position: absolute; inset: 0; opacity: .55; filter: saturate(.7) brightness(.8); }
  .ring { position: absolute; left: 50%; top: 46%; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%;
    background: radial-gradient(circle, rgba(7,8,12,.96) 0 46%, rgba(255,61,87,.22) 52%, rgba(255,61,87,.04) 64%, transparent 72%);
    box-shadow: 0 0 120px rgba(255,61,87,.35), 0 0 0 3px rgba(255,61,87,.55) inset; display: grid; place-items: center; text-align: center;
    animation: pop .6s ease forwards; opacity: 0; }
  .ring .cap { font-size: 18px; letter-spacing: .3em; color: #ff8595; }
  .ring .num { font-family: var(--mono); font-size: 78px; font-weight: 700; color: #fff; text-shadow: 0 0 30px rgba(255,61,87,.8); margin-top: 8px; }
  .ring .sub { font-size: 16px; color: var(--muted); margin-top: 10px; }
  .wires { position: absolute; inset: 0; }
  .wires path { fill: none; stroke: var(--danger); stroke-width: 3; opacity: .85; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 2.6s ease-out forwards; animation-delay: var(--d); filter: drop-shadow(0 0 8px rgba(255,61,87,.8)); }
  .kbd { position: absolute; padding: 8px 14px; border-radius: 8px; background: #1a1d28; border: 1px solid #3a4052; font-family: var(--mono); font-size: 18px; box-shadow: 0 4px 0 #0a0c12; opacity: 0; animation: pop .4s ease forwards; animation-delay: var(--d); }
  .s-counter .caption { position: absolute; left: 80px; right: 80px; top: 1180px; text-align: center; font-size: 50px; line-height: 1.2; font-weight: 700; opacity: 0; animation: rise .6s ease forwards; animation-delay: .6s; text-wrap: balance; }
  .s-counter .caption strong { color: var(--danger); font-weight: 800; }
  .s-counter .small { position: absolute; left: 80px; right: 80px; top: 1320px; text-align: center; font-family: var(--mono); font-size: 20px; color: var(--muted); opacity: 0; animation: fadein .5s ease forwards; animation-delay: 1.2s; }

  /* ---- orb: tek dijital merkez ---- */
  .orb { position: absolute; left: 50%; top: 46%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff 0%, #b7c2ff 18%, #6d8cff 45%, #4c3fd1 75%, #2a1f8a 100%);
    box-shadow: 0 0 80px 20px rgba(109,140,255,.55), 0 0 220px 60px rgba(124,92,255,.35); animation: pop 1s cubic-bezier(.2,.8,.2,1) forwards; opacity: 0; }
  .orbit { position: absolute; left: 50%; top: 46%; border: 1px solid rgba(167,139,250,.25); border-radius: 50%; transform: translate(-50%,-50%); }
  .star { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: twinkle var(--p) ease-in-out infinite; animation-delay: var(--d); }
  .sat { position: absolute; width: 84px; height: 84px; border-radius: 22px; background: var(--panel2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 34px; opacity: 0;
    animation: pop .5s ease forwards; animation-delay: var(--d); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .s-orb .lines { position: absolute; left: 80px; right: 80px; top: 1130px; text-align: center; }
  .s-orb .line { font-size: 60px; line-height: 1.2; font-weight: 700; opacity: 0; animation: rise .7s ease forwards; animation-delay: var(--d); text-wrap: balance; }
  .s-orb .line em { font-style: normal; color: var(--muted); font-weight: 500; font-size: 44px; }
  .s-orb .line s { color: var(--muted); text-decoration-color: var(--danger); }
  .s-orb .line strong { color: var(--accent2); font-weight: 800; }

  /* ---- dashboard ---- */
  .dash { position: absolute; left: 60px; right: 60px; top: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 28px; opacity: 0;
    animation: pop .7s cubic-bezier(.2,.8,.2,1) forwards; box-shadow: 0 50px 120px rgba(0,0,0,.6); }
  .dash .head { display: flex; justify-content: space-between; align-items: center; font-size: 18px; color: var(--muted); margin-bottom: 22px; }
  .dash .head b { color: var(--ink); font-size: 22px; letter-spacing: .1em; }
  .dash .live { display: flex; align-items: center; gap: 8px; } .dash .live i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); animation: pulse 1.6s infinite; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .kpi { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; opacity: 0; animation: rise .5s ease forwards; animation-delay: var(--d); }
  .kpi .l { font-size: 16px; color: var(--muted); } .kpi .v { font-size: 46px; font-weight: 800; letter-spacing: -.02em; margin: 6px 0 2px; }
  .kpi .dlt { font-size: 15px; color: var(--ok); font-weight: 700; } .kpi .dlt.neg { color: var(--danger); }
  .chart { margin-top: 18px; height: 300px; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; opacity: 0; animation: fadein .5s ease forwards; animation-delay: .9s; }
  .chart svg { width: 100%; height: 100%; }
  .chart .area { fill: url(#g1); opacity: 0; animation: fadein 1.2s ease forwards; animation-delay: 1.4s; }
  .chart .ln { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 3000; stroke-dashoffset: 3000; animation: draw 2.2s ease-out forwards; animation-delay: 1.1s; filter: drop-shadow(0 0 8px rgba(109,140,255,.7)); }
  .s-dash .lines { position: absolute; left: 80px; right: 80px; top: 320px; font-size: 62px; line-height: 1.15; font-weight: 700; text-wrap: balance; opacity: 0; animation: rise .6s ease forwards; }
  .s-dash .lines strong { color: var(--accent); }

  /* ---- headline (haber kartı) ---- */
  .s-head .kicker { position: absolute; left: 80px; top: 520px; display: inline-flex; gap: 14px; align-items: center; font-size: 24px; letter-spacing: .22em; color: var(--accent); font-weight: 700; opacity: 0; animation: rise .5s ease forwards; }
  .s-head .kicker i { width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 16px var(--accent); }
  .s-head h1 { position: absolute; left: 80px; right: 80px; top: 600px; font-size: 92px; line-height: 1.06; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; opacity: 0; animation: rise .7s ease forwards; animation-delay: .2s; }
  .s-head h1 strong { color: var(--accent); }
  .s-head p { position: absolute; left: 80px; right: 80px; top: var(--pt, 1060px); font-size: 40px; line-height: 1.4; color: var(--muted); opacity: 0; animation: rise .6s ease forwards; animation-delay: .7s; }
  .s-head .src { position: absolute; left: 80px; bottom: 420px; padding: 12px 20px; border: 1px solid var(--line); border-radius: 999px; font-size: 22px; color: var(--muted); background: rgba(255,255,255,.03); opacity: 0; animation: fadein .5s ease forwards; animation-delay: 1.1s; }

  /* ---- list (madde madde) ---- */
  .s-list .lines { position: absolute; left: 80px; right: 80px; top: 360px; font-size: 64px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; opacity: 0; animation: rise .6s ease forwards; }
  .s-list .lines strong { color: var(--accent); }
  .items { position: absolute; left: 80px; right: 80px; top: 640px; }
  .item { display: flex; gap: 26px; align-items: flex-start; padding: 26px 0; border-bottom: 1px solid var(--line); opacity: 0; animation: rise .55s ease forwards; animation-delay: var(--d); }
  .item .n { flex: none; width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; box-shadow: 0 10px 30px rgba(109,140,255,.35); }
  .item b { display: block; font-size: 40px; font-weight: 700; line-height: 1.2; }
  .item span { display: block; font-size: 28px; color: var(--muted); margin-top: 8px; line-height: 1.35; }

  /* ---- outro ---- */
  .s-outro .logo { position: absolute; left: 80px; right: 80px; top: 44%; text-align: center; font-size: 96px; font-weight: 800; letter-spacing: .32em; opacity: 0; animation: pop .8s ease forwards;
    background: linear-gradient(90deg, #fff, #c7d2ff, #fff); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
  .s-outro .tag { position: absolute; left: 80px; right: 80px; top: calc(44% + 150px); text-align: center; font-size: 38px; color: var(--muted); opacity: 0; animation: rise .6s ease forwards; animation-delay: .5s; }
  .s-outro .ctawrap { position: absolute; left: 0; right: 0; top: calc(44% + 290px); text-align: center; }
  .s-outro .cta { display: inline-block; padding: 22px 44px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 34px; font-weight: 700; opacity: 0; animation: pop .6s ease forwards; animation-delay: .9s; box-shadow: 0 20px 60px rgba(109,140,255,.45); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  const SPEC = window.__SPEC || { scenes: [] };
  const stage = document.getElementById('stage');
  let current = -1, currentEl = null;

  // Basit deterministik rastgele (her render aynı)
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // *kelime* → <strong>, _kelime_ → <em>, ~kelime~ → <s>
  const rich = s => esc(s).replace(/\*(.+?)\*/g,'<strong>$1</strong>').replace(/_(.+?)_/g,'<em>$1</em>').replace(/~(.+?)~/g,'<s>$1</s>');

  // ---------- Sahte arayüz pencereleri ----------
  const WINDOWS = {
    orders: () => `<div class="bar"><i></i><i></i><i></i><span>panel.magaza.com/siparisler</span></div><div class="body"><table>
      <tr><th>#</th><th>Müşteri</th><th>Ürün</th><th>Tutar</th><th>Durum</th></tr>
      ${[['10482','Elif Y.','Kablosuz Kulaklık X2','₺1.249','r|Ödeme bekliyor'],['10483','Mert K.','Akıllı Saat S7','₺3.899','y|Hazırlanıyor'],['10484','Zeynep A.','Laptop Çantası 15"','₺649','g|Kargoda'],['10485','Can D.','USB-C Hub 7in1','₺899','r|İptal?'],['10486','Ayşe Ç.','Monitör 27" QHD','₺8.499','y|Stok yok'],['10487','Burak Ş.','Mekanik Klavye','₺2.150','g|Teslim']].map(r=>{const [c,t]=r[4].split('|');return `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="chip ${c}">${t}</span></td></tr>`;}).join('')}
      </table></div>`,
    sheet: () => `<div class="bar"><i></i><i></i><i></i><span>stok_GUNCEL_son3 (2).xlsx</span></div><div class="body"><table class="sheet">
      <tr><th></th><th>SKU</th><th>Ürün</th><th>Depo</th><th>Stok</th><th>Sistem</th></tr>
      ${[['1042','Kablosuz Kulaklık','IST','140','#REF!'],['1043','Akıllı Saat S7','IST','12','9'],['1044','Laptop Çantası','ANK','0','23'],['1045','USB-C Hub','IST','45','#N/A'],['1046','Monitör 27"','IZM','3','3'],['1047','Mekanik Klavye','IST','210','208'],['1048','Webcam 4K','ANK','#YOK','17']].map((r,i)=>`<tr><td>${i+2}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${/#/.test(r[3])?'err':''}">${r[3]}</td><td class="${/#/.test(r[4])?'err':''}">${r[4]}</td></tr>`).join('')}
      </table></div>`,
    chat: () => `<div class="bar"><i></i><i></i><i></i><span>Müşteri Destek (Grup) · 48 kişi</span></div><div class="body chat">
      <div class="msg">Kargom nerede?? 3 gündür bekliyorum<small>+90 532 ••• 14:02</small></div>
      <div class="msg">Stokta var yazıyordu, neden iptal edildi?<small>Elif Y. 14:05</small></div>
      <div class="msg me">Kontrol edip hemen dönüyorum 🙏<small>Siz 14:31</small></div>
      <div class="msg">Hâlâ dönüş yok…<small>+90 532 ••• 16:48</small></div></div>`,
    map: () => `<div class="bar"><i></i><i></i><i></i><span>kargotakip.example/gonderiler</span></div><div class="body"><div class="map">
      <svg class="route" viewBox="0 0 720 300"><path d="M60 230 C 200 60, 380 260, 520 110 S 680 120, 690 60" fill="none" stroke="#ff3d57" stroke-width="3" stroke-dasharray="10 10"/></svg>
      <span class="pin" style="left:52px;top:222px"></span><span class="pin" style="left:512px;top:102px"></span><span class="pin" style="left:682px;top:52px"></span>
      <div style="position:absolute;left:300px;top:40px;padding:8px 12px;background:#1a1d28;border:1px solid #3a4052;border-radius:8px;font-size:14px">⚠ 16 gönderi gecikmede</div></div></div>`,
    mail: () => `<div class="bar"><i></i><i></i><i></i><span>Gelen Kutusu · 1.284 okunmamış</span></div><div class="body mail">
      ${[['Fatura #4471','Sayın ilgili, ödeme vadesi geçmiştir…',1],['Tedarikçi','Fiyat listesi güncellendi (v7) ek…',1],['Muhasebe','Mart raporunu tekrar gönderir misiniz',0],['Kargo','Teslimat adresi hatalı görünüyor',1],['Müşteri','İade talebim hâlâ onaylanmadı',1],['IT','Şifre süresi doldu (3. uyarı)',0]].map(r=>`<div class="row ${r[2]?'unread':''}"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div>`,
    kanban: () => `<div class="bar"><i></i><i></i><i></i><span>Görevler · Sprint 14</span></div><div class="body kanban">
      <div class="col"><h5>YAPILACAK · 23</h5><div class="card">Stok sayımı (tekrar)</div><div class="card">Excel'i panele aktar</div><div class="card">Kargo listesi gönder</div></div>
      <div class="col"><h5>DEVAM · 11</h5><div class="card">Müşteri şikâyetleri</div><div class="card">Fatura eşleştirme</div></div>
      <div class="col"><h5>BİTTİ · 2</h5><div class="card">Toplantı notu</div></div></div>`,
  };
  const WIN_KEYS = Object.keys(WINDOWS);
  function pickWindow(hint, i) {
    const h = (hint || '').toLowerCase();
    if (/sipariş|order|panel|e-?ticaret|satış/.test(h)) return 'orders';
    if (/excel|stok|tablo|sheet|liste/.test(h)) return 'sheet';
    if (/whatsapp|mesaj|chat|şikâyet|şikayet|destek|telefon/.test(h)) return 'chat';
    if (/kargo|teslim|harita|rota|lojistik/.test(h)) return 'map';
    if (/mail|e-?posta|fatura|muhasebe/.test(h)) return 'mail';
    if (/görev|task|ekip|sprint|iş/.test(h)) return 'kanban';
    return WIN_KEYS[i % WIN_KEYS.length];
  }
  const LAYOUT = [ // x, y, ry, rx, rz, scale
    [60, 380, -16, 8, -4, .70], [300, 560, 14, 6, 3, .64], [40, 740, -10, -6, 2, .60], [310, 900, 16, -8, -3, .56], [160, 1040, -14, 4, -2, .52]
  ];
  function windowsHtml(items, limit) {
    return items.slice(0, limit).map((it, i) => {
      const k = pickWindow(it.b || it.a, i), L = LAYOUT[i % LAYOUT.length];
      return `<div class="win ${i % 2 ? 'alt' : ''}" style="left:${L[0]}px;top:${L[1]}px;--ry:${L[2]}deg;--rx:${L[3]}deg;--rz:${L[4]}deg;--sc:${L[5]};--d:${(0.25 + i * 0.75).toFixed(2)}s">${WINDOWS[k]()}</div>`;
    }).join('');
  }

  // ---------- Sahne üreticileri ----------
  const SCENES = {
    title(s) {
      const lines = (s.lines && s.lines.length ? s.lines : [s.title || '']).map((l, i) => `<div class="line" style="--d:${(0.15 + i * 0.9).toFixed(2)}s">${rich(l)}</div>`).join('');
      return `<div class="scene s-title ${s.mood === 'danger' ? 'danger' : ''}"><div class="glow ${s.mood === 'danger' ? 'red' : 'blue'}"></div><div class="vignette"></div><div class="brand">ARKESOFT</div><div class="lines">${lines}</div></div>`;
    },
    chaos(s) {
      const items = s.items || [];
      const labels = items.slice(0, 5).map((it, i) => `<div class="label" style="--d:${(0.45 + i * 0.75).toFixed(2)}s"><span class="n">${i + 1}</span><b>${esc(it.a)}</b><span class="arr">→</span><span>${esc(it.b)}</span></div>`).join('');
      return `<div class="scene s-chaos"><div class="glow red"></div><div class="vignette"></div><div class="brand">ARKESOFT</div>
        ${s.title ? `<div class="lines">${rich(s.title)}</div>` : ''}${windowsHtml(items, 4)}<div class="shade"></div><div class="labels">${labels}</div></div>`;
    },
    counter(s) {
      const items = (s.items && s.items.length ? s.items : [{a:'Siparişler',b:'panel'},{a:'Stok',b:'excel'},{a:'Şikâyet',b:'whatsapp'}]);
      const kbd = ['Ctrl + C', 'Ctrl + V', 'Ctrl + C', 'Ctrl + V'].map((k, i) => `<div class="kbd" style="left:${[120, 780, 160, 760][i]}px;top:${[620, 700, 1080, 1010][i]}px;--d:${(1 + i * .5).toFixed(2)}s">${k}</div>`).join('');
      const r = rng(7); const wires = [0, 1, 2].map(i => `<path style="--d:${(0.3 + i * .4).toFixed(2)}s" d="M${100 + r() * 200} ${500 + r() * 300} C ${300 + r() * 300} ${700 + r() * 400}, ${500 + r() * 300} ${600 + r() * 500}, ${540} ${880} S ${700 + r() * 200} ${1100 + r() * 300}, ${900} ${1300 + r() * 200}"/>`).join('');
      return `<div class="scene s-counter"><div class="glow red"></div><div class="wins">${windowsHtml(items, 3)}</div><div class="vignette"></div><div class="brand">ARKESOFT</div>
        <svg class="wires" viewBox="0 0 1080 1920">${wires}</svg>${kbd}
        <div class="ring"><div><div class="cap">${esc(s.cap || 'BOŞA GİDEN ZAMAN')}</div><div class="num" data-counter>00:00:00</div><div class="sub">${esc(s.sub || 'bu hafta · ekip toplamı')}</div></div></div>
        <div class="caption">${rich(s.title || '')}</div><div class="small">${esc(s.note || 'manuel veri girişi · kopyala-yapıştır · ekranlar arası geçiş')}</div></div>`;
    },
    orb(s) {
      const r = rng(11); const stars = Array.from({ length: 70 }, () => `<i class="star" style="left:${(r() * 1080) | 0}px;top:${(r() * 1400 + 120) | 0}px;--p:${(1.5 + r() * 2.5).toFixed(2)}s;--d:${(-r() * 3).toFixed(2)}s;transform:scale(${(.4 + r()).toFixed(2)})"></i>`).join('');
      const icons = ['🛒', '📦', '💬', '📊', '🚚', '🧾'];
      const sats = icons.slice(0, Math.min(6, (s.items || []).length || 4)).map((ic, i, arr) => { const a = (i / arr.length) * Math.PI * 2 - Math.PI / 2, R = 300; return `<div class="sat" style="left:${(540 + Math.cos(a) * R - 42) | 0}px;top:${(880 + Math.sin(a) * R - 42) | 0}px;--d:${(1.2 + i * .18).toFixed(2)}s">${ic}</div>`; }).join('');
      const lines = (s.lines || [s.title || '']).map((l, i) => `<div class="line" style="--d:${(0.6 + i * 1.1).toFixed(2)}s">${rich(l)}</div>`).join('');
      return `<div class="scene s-orb"><div class="glow violet"></div>${stars}<div class="orbit" style="width:560px;height:560px"></div><div class="orbit" style="width:760px;height:760px;opacity:.6"></div>
        <div class="orb"></div>${sats}<div class="vignette"></div><div class="brand">ARKESOFT</div><div class="lines">${lines}</div></div>`;
    },
    dashboard(s) {
      const kpis = (s.items && s.items.length ? s.items : [{a:'1.284',b:'Bugünkü sipariş',c:'+18,4%'},{a:'%99,8',b:'Stok doğruluğu',c:'+12,1 puan'},{a:'2 dk',b:'Ort. yanıt süresi',c:'-41 dk'},{a:'%98,4',b:'Zamanında teslimat',c:'+9,2%'}]).slice(0, 4)
        .map((k, i) => `<div class="kpi" style="--d:${(0.5 + i * .15).toFixed(2)}s"><div class="l">${esc(k.b)}</div><div class="v">${esc(k.a)}</div><div class="dlt ${/^-/.test(k.c || '') ? 'neg' : ''}">${esc(k.c || '')}</div></div>`).join('');
      const r = rng(5); let x = 0, pts = []; for (let i = 0; i <= 16; i++) { pts.push([i * 60, 230 - (i * 9 + r() * 60)]); }
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1].toFixed(0)).join(' ');
      return `<div class="scene s-dash"><div class="glow blue"></div><div class="vignette"></div><div class="brand">ARKESOFT</div>
        ${s.title ? `<div class="lines">${rich(s.title)}</div>` : ''}
        <div class="dash"><div class="head"><b>ARKESOFT · ${esc(s.cap || 'Genel Bakış')}</b><div class="live"><i></i>canlı</div></div><div class="kpis">${kpis}</div>
        <div class="chart"><svg viewBox="0 0 960 260"><defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6d8cff" stop-opacity=".45"/><stop offset="1" stop-color="#6d8cff" stop-opacity="0"/></linearGradient></defs>
        <path class="area" d="${d} L 960 260 L 0 260 Z"/><path class="ln" d="${d}"/></svg></div></div><div class="url">arkesoft.com</div></div>`;
    },
    headline(s) {
      const pt = s.title && s.title.length > 40 ? 1180 : 1060;
      return `<div class="scene s-head"><div class="glow blue"></div><div class="vignette"></div><div class="brand">ARKESOFT</div>
        <div class="kicker"><i></i>${esc(s.cap || 'GÜNDEM')}</div><h1>${rich(s.title || '')}</h1>${s.lines && s.lines[0] ? `<p style="--pt:${pt}px">${rich(s.lines[0])}</p>` : ''}
        ${s.source ? `<div class="src">Kaynak: ${esc(s.source)}</div>` : ''}</div>`;
    },
    list(s) {
      const items = (s.items || []).slice(0, 4).map((it, i) => `<div class="item" style="--d:${(0.6 + i * .9).toFixed(2)}s"><div class="n">${i + 1}</div><div><b>${rich(it.a)}</b>${it.b ? `<span>${rich(it.b)}</span>` : ''}</div></div>`).join('');
      return `<div class="scene s-list"><div class="glow blue"></div><div class="vignette"></div><div class="brand">ARKESOFT</div><div class="lines">${rich(s.title || '')}</div><div class="items">${items}</div></div>`;
    },
    outro(s) {
      return `<div class="scene s-outro"><div class="glow violet"></div><div class="vignette"></div><div class="logo">ARKESOFT</div><div class="tag">${rich(s.title || 'Strateji, tasarım ve teknoloji. Aynı takımda.')}</div><div class="ctawrap"><div class="cta">${esc(s.cap || 'Projenizi konuşalım · arkesoft.com')}</div></div></div>`;
    },
  };

  function mount(i) {
    if (currentEl) currentEl.remove();
    const s = SPEC.scenes[i];
    const fn = SCENES[s.type] || SCENES.title;
    const wrap = document.createElement('div'); wrap.innerHTML = fn(s); currentEl = wrap.firstElementChild; stage.appendChild(currentEl);
    current = i;
  }
  function pad(n) { return String(n).padStart(2, '0'); }

  window.seek = function (t) {
    const scenes = SPEC.scenes; let i = scenes.length - 1;
    for (let k = 0; k < scenes.length; k++) if (t < scenes[k].start + scenes[k].dur) { i = k; break; }
    if (i !== current) mount(i);
    const s = scenes[i], local = Math.max(0, t - s.start);
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = local * 1000; });
    // sahne geçişi: son 0.35 sn'de kararma, ilk 0.25 sn'de açılma
    const fade = Math.min(1, local / 0.25, Math.max(0, (s.dur - local) / 0.35));
    currentEl.style.opacity = fade.toFixed(3);
    const c = currentEl.querySelector('[data-counter]');
    if (c) { const total = Math.floor(Math.min(1, local / Math.max(0.1, s.dur - 0.8)) * (s.seconds || 27772)); c.textContent = `${pad(Math.floor(total / 3600))}:${pad(Math.floor(total % 3600 / 60))}:${pad(total % 60)}`; }
    return i;
  };
  window.ready = true;
})();
</script>
</body>
</html>
